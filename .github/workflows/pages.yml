name: Deploy documentation website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.dsh/skills/cybersecurity-ops/**'
      - 'tools/build_site.py'
      - 'tools/build_release.py'
      - 'tests/test_site.py'
      - 'tests/site-tools.test.cjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'tools/build_site.py'
      - 'tests/test_site.py'
      - 'tests/site-tools.test.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify static rendering and tool boundaries
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/site-tools.test.cjs
          node --check website/app.js
      - name: Build documentation and Skill download
        run: python tools/build_site.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
